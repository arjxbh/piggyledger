<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a family - Piggy Ledger</title>
<link rel="icon" type="image/png" href="/images/piggy-ledger-logo.png">
<script src="/js/theme.js"></script>
<script src="/js/ui.js" defer></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="signup-page">
  <div class="login-wrap">
    <div class="login-title"><img class="brand-logo" src="/images/piggy-ledger-logo.png" alt=""> Piggy Ledger</div>
    <div class="login-sub">Create your family</div>
    <div class="card">
      <div class="form-row">
        <label for="familyName">Family name</label>
        <input id="familyName" autocomplete="organization" placeholder="The Smith family">
      </div>
      <div class="form-row">
        <label for="parentName">Your name</label>
        <input id="parentName" autocomplete="name" placeholder="Alex">
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" placeholder="alex@example.com">
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input type="password" id="password" minlength="10" autocomplete="new-password" placeholder="At least 10 characters">
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="signupBtn">Create family</button>
        <a class="btn btn-ghost" href="/">Back to home</a>
      </div>
      <div class="error-msg" role="alert" id="signupError"></div>
      <div class="status-message" id="signupStatus" aria-live="polite"></div>
    </div>
  </div>
  <p class="fine-print">Piggy Ledger is a record-keeping tool, not a financial institution. Parents and guardians are solely responsible for the custody, handling, and transfer of any currency or other assets represented in the application.</p>

  <script src="/js/signup.js"></script>
</body>
</html>
