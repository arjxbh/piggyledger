<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piggy Ledger — My Chores</title>
<link rel="icon" type="image/png" href="/images/piggy-ledger-logo.png">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><img class="brand-logo" src="/images/piggy-ledger-logo.png" alt=""> Piggy Ledger</div>
    <div class="who">
      <span id="whoName"></span>
      <button class="logout" id="logoutBtn">Log out</button>
    </div>

    <section class="money-actions" aria-labelledby="moneyActionsTitle">
      <h2 id="moneyActionsTitle">My money</h2>
      <div class="money-action-grid">
        <button class="money-action deposit" type="button" data-money-kind="deposit">
          <svg viewBox="0 0 120 100" aria-hidden="true">
            <path d="M24 45h72v43H24zM18 39h84v12H18zM45 18h30v21H45z"/>
            <path class="arrow" d="M60 5v25m-10-10 10 10 10-10"/>
          </svg>
          <span>Put money in</span>
        </button>
        <button class="money-action withdrawal" type="button" data-money-kind="withdrawal">
          <svg viewBox="0 0 120 100" aria-hidden="true">
            <path d="M24 45h72v43H24zM18 39h84v12H18zM45 18h30v21H45z"/>
            <path class="arrow" d="M60 31V6M50 16 60 6l10 10"/>
          </svg>
          <span>Take money out</span>
        </button>
      </div>
    </section>
  </div>

  <main>
    <div class="balance-hero">
      <div>
        <h1 id="greeting">Hi!</h1>
        <div class="muted">Here's what's on your list</div>
      </div>
      <div>
        <div class="muted" style="text-align:right;">My balance</div>
        <div class="amount" id="balanceAmt">$0.00</div>
      </div>
    </div>

    <div class="section-head">
      <h2>My chores</h2>
    </div>
    <div class="ticket-list" id="choreList"></div>

    <div class="card" style="margin-top:26px;">
      <div class="section-head">
        <h2>My history</h2>
      </div>
      <table id="ledgerTable">
        <thead><tr><th>Date</th><th>Reason</th><th style="text-align:right;">Amount</th></tr></thead>
        <tbody id="ledgerBody"></tbody>
      </table>
    </div>
  </main>

  <div class="modal-backdrop hidden" id="moneyRequestModal">
    <div class="modal kid-money-modal" role="dialog" aria-modal="true" aria-labelledby="moneyRequestTitle">
      <h2 id="moneyRequestTitle">How much?</h2>
      <div class="request-total" id="requestTotal">$0</div>
      <div class="amount-pad" aria-label="Type a dollar amount">
        <button type="button" data-amount-key="1">1</button>
        <button type="button" data-amount-key="2">2</button>
        <button type="button" data-amount-key="3">3</button>
        <button type="button" data-amount-key="4">4</button>
        <button type="button" data-amount-key="5">5</button>
        <button type="button" data-amount-key="6">6</button>
        <button type="button" data-amount-key="7">7</button>
        <button type="button" data-amount-key="8">8</button>
        <button type="button" data-amount-key="9">9</button>
        <button type="button" data-amount-key=".">.</button>
        <button type="button" data-amount-key="0">0</button>
        <button type="button" id="amountDeleteBtn" aria-label="Delete the last number">&#8592;</button>
        <button type="button" class="amount-help" id="amountHelpBtn" aria-label="I do not know the amount">?</button>
      </div>
      <div class="request-message" id="requestMessage" aria-live="polite"></div>
      <button class="btn btn-primary request-send" type="button" id="sendMoneyRequestBtn" disabled>Ask my parent</button>
      <button class="back-link" type="button" id="cancelMoneyRequestBtn">Never mind</button>
    </div>
  </div>

  <script src="/js/kid.js"></script>
</body>
</html>
