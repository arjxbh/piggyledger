<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Piggy Ledger</title>
<link rel="icon" type="image/png" href="/images/piggy-ledger-logo.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-title"><img class="brand-logo" src="/images/piggy-ledger-logo.png" alt=""> Piggy Ledger</div>
    <div class="login-sub" id="subtitle">Tap your name to sign in</div>

    <div class="profile-grid" id="profileGrid"></div>
    <div class="form-actions" style="margin-top:14px; text-align:center;">
      <button class="btn btn-ghost" id="scanTokenBtn">Scan access token QR</button>
    </div>
    <div class="card" id="emailAccessCard" style="margin-top:18px;">
      <h2>Email me an access link</h2>
      <div class="muted">For parents whose saved access has expired or is missing.</div>
      <div class="form-row">
        <label for="accessEmail">Parent email</label>
        <input type="email" id="accessEmail" autocomplete="email" placeholder="parent@example.com">
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="emailAccessBtn">Send access link</button>
        <a class="btn btn-ghost" href="/signup.html">Create a family</a>
      </div>
      <div class="muted" id="emailAccessStatus"></div>
    </div>

    <div class="auth-panel hidden" id="authPanel">
      <div class="name" id="authName"></div>
      <div id="passwordBlock" class="hidden">
        <div class="form-row">
          <input type="password" id="passwordInput" placeholder="Password" autofocus>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" style="width:100%" id="passwordSubmit">Sign in</button>
        </div>
      </div>
      <div id="pinBlock" class="hidden">
        <div class="pin-display" id="pinDisplay"></div>
        <div class="pin-pad" id="pinPad"></div>
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <button class="back-link" id="backBtn">&larr; choose a different profile</button>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="scanModal">
    <div class="modal">
      <h2>Scan access token QR</h2>
      <video id="qrVideo" width="320" height="240" autoplay muted playsinline style="width:100%; border-radius:12px; background:#000;"></video>
      <div class="form-actions">
        <button class="btn btn-primary" id="stopScanBtn">Stop scan</button>
        <button class="btn btn-ghost" id="cancelScanBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/js/jsqr.min.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
