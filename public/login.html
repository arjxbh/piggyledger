<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Piggy Ledger</title>
<link rel="icon" type="image/png" href="/images/piggy-ledger-logo.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-title"><img class="brand-logo" src="/images/piggy-ledger-logo.png" alt=""> Piggy Ledger</div>
    <div class="login-sub" id="subtitle">Choose your name to sign in</div>

    <div class="profile-grid" id="profileGrid"></div>
    <div class="login-entry hidden" id="loginEntry">
      <section class="kid-login-card">
        <h1>Ask your parent for a QR code.</h1>
        <p>When they show it to you, tap the button and point this device at the code.</p>
        <button class="btn btn-primary kid-scan-button" id="scanTokenBtn">Scan my QR code</button>
      </section>

      <section class="adult-login-card" id="emailAccessCard">
        <h2>Are you an adult?</h2>
        <p>Enter your email and we’ll send you a sign-in link.</p>
        <div class="form-row">
          <label for="accessEmail">Your email</label>
          <input type="email" id="accessEmail" autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-actions">
          <button class="btn btn-ghost" id="emailAccessBtn">Email me a sign-in link</button>
        </div>
        <div class="muted" id="emailAccessStatus" aria-live="polite"></div>
      </section>

      <div class="signup-prompt">
        No family account yet? <a href="/signup.html">Sign up here</a>
      </div>
    </div>
    <button class="switch-family-link hidden" id="switchFamilyBtn">Switch to a different family</button>

    <div class="auth-panel hidden" id="authPanel">
      <div class="name" id="authName"></div>
      <div id="passwordBlock" class="hidden">
        <div class="form-row">
          <input type="password" id="passwordInput" placeholder="Password" autofocus>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" style="width:100%" id="passwordSubmit">Sign in</button>
        </div>
      </div>
      <div id="pinBlock" class="hidden">
        <div class="pin-display" id="pinDisplay"></div>
        <div class="pin-pad" id="pinPad"></div>
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <button class="back-link" id="backBtn">&larr; choose a different profile</button>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="scanModal">
    <div class="modal">
      <h2>Scan your family’s QR code</h2>
      <video id="qrVideo" width="320" height="240" autoplay muted playsinline style="width:100%; border-radius:12px; background:#000;"></video>
      <div class="form-actions">
        <button class="btn btn-primary" id="stopScanBtn">Stop scan</button>
        <button class="btn btn-ghost" id="cancelScanBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/js/jsqr.min.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
